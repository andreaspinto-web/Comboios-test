<!doctype html><html lang='pt'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Comboios</title><style>body{font:16px system-ui;background:#101827;color:white;max-width:600px;margin:35px auto;padding:15px}main{background:#203047;border-radius:20px;padding:24px}input{width:100%;accent-color:#65d7fa}select{padding:12px;border-radius:10px;margin:5px}article{background:#30445e;padding:14px;border-radius:12px;margin:10px 0}</style><h1>🚆 Comboios</h1><main><p>Protótipo interativo · horários demonstrativos</p><select id='a'><option>Massamá-Barcarena</option><option>Entrecampos</option><option>Sete Rios</option></select> → <select id='b'><option>Castanheira do Ribatejo</option><option>Entrecampos</option><option>Sete Rios</option></select><h2 id='t'></h2><input id='s' type='range' min='0' max='1435' step='5' value='720'><h3>Resultados</h3><div id='r'></div><small>⚠️ Horários fictícios para testar o slider; não são dados da CP.</small></main><script>const s=document.querySelector('#s'),t=document.querySelector('#t'),r=document.querySelector('#r');function f(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function u(){let n=+s.value;t.textContent=f(n);r.innerHTML='';for(let i=0;i<3;i++){let e=document.createElement('article');e.textContent=f(Math.min(1435,n+i*20))+' · '+document.querySelector('#a').value+' → '+document.querySelector('#b').value+' (exemplo)';r.append(e)}}s.oninput=u;document.querySelectorAll('select').forEach(e=>e.onchange=u);u()</script></html>
